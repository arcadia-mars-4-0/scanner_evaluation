# Run-specific config for analysis/scanner_synthetic.ipynb.
# Synthetic-data evaluation: every transcript is assumed to be a violation
# (target = 100% positive rate). There is no validation file.

target_scanner: ground_truth_access      # directory name under evals/scans/
split: dev                                # "dev" or "test"
scanner_key: null                         # null = auto-detect from parquets
violation_threshold: 2                    # score >= threshold counts as a positive

# Subdirectory under analysis/results/{target_scanner}/{split}/ for figures/tables.
# Set to null to skip saving outputs.
results_subdir: synthetic_dev

# Optional scan_id filters (empty list = no filter).
include_scan_ids:
  - kpsLgckzxoTckrwERUrqrd
exclude_scan_ids: []

# Synthetic data is grouped by eval_file rather than by benchmark name, since
# multiple eval files can share a benchmark but use different synthetic-data
# approaches. Map each eval_file basename to a short display label; eval_files
# not listed here will still appear, labeled by their (benchmark, eval_file)
# fallback.
eval_file_groups:
  2026-03-27T14-34-51+00-00_swe-bench-verified-mini_n3CMjefQBLv9aioCrWJruf.eval: SWE-Bench - Contamination
  2026-04-05T18-27-27+00-00_swe-bench_38WCvSh5XQpJH98tnAKxit.eval: SWE-Bench - Contamination
  2026-04-06T02-03-57+00-00_core-bench_Lcen3QviFFvtpzLR2M7igN.eval: CORE-Bench - Contamination
